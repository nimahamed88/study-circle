{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Neuroscience Study Circle{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>

<body>

<header class="site-header">
    <div class="container header-inner">

        <a href="{% url 'home' %}" class="site-title">
            Neuroscience Study Circle
        </a>

        <nav class="main-nav">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'programme' %}">Programme</a>
            <a href="{% url 'members' %}">Members</a>
            <a href="{% url 'subgroups' %}">Subgroups</a>
            <a href="{% url 'contact' %}">Contact</a>
        </nav>

    </div>
</header>


<main>
    {% block content %}
    {% endblock %}
</main>


<footer class="site-footer">
    <div class="container">
        <p>Neuroscience Study Circle</p>
        <p>Interdisciplinary discussions on the science and philosophy of the mind.</p>
    </div>
</footer>

</body>
</html>
